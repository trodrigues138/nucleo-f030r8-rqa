; NUCLEO-F030R8 vista pelo ST-Link.
;   pio run -e embedded
;   pio run -e optimized
;   pio run -e optimized_serial
;   pio run -e embedded_serial
;   pio run -e embedded -t upload
;   pio run -e optimized_serial -t upload
;   pio run -e embedded_serial -t upload
;   pio debug -e embedded

[platformio]
src_dir = .
default_envs = embedded

[env]
platform = ststm32
board = nucleo_f030r8
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
board_build.ldscript = ldscripts/stm32f030r8.ld
build_flags =
    -std=gnu11
    -Os
    -Wl,-lm
    -Wl,--print-memory-usage

[env:embedded]
build_src_filter = +<rqa_embedded.c>

[env:embedded_serial]
build_src_filter = +<rqa_embedded_serial.c>
build_flags =
    ${env.build_flags}
    -Wl,--defsym=__stack_size=0x30

[env:optimized]
build_src_filter = +<rqa_embedded_optimized.c>
build_flags =
    ${env.build_flags}
    -Wl,--defsym=__stack_size=0x1D8

[env:optimized_serial]
build_src_filter = +<rqa_embedded_optimized_serial.c>
build_flags =
    ${env.build_flags}
    -Wl,--defsym=__stack_size=0x400
